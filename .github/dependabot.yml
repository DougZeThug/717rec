version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "@testing-library/*"
          - "vitest*"
          - "@vitest/*"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "@testing-library/*"
          # vitest and @vitest/coverage-v8 must move together: coverage needs
          # the exact same Vitest version.
          - "vitest*"
          - "@vitest/*"
    ignore:
      # Avoid React 19.x until ecosystem stabilizes
      - dependency-name: "react"
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]
      # tailwind-merge 3.7.1 stops dropping leading-* when a text-* size follows
      # it, which changes line heights (this project keeps v3 fixed line heights).
      # Held at exactly 3.7.0 until that is handled.
      - dependency-name: "tailwind-merge"
        versions: [">3.7.0"]
